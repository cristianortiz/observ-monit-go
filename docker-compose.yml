services:
  # ============================================
  # FACTORIT API - Aplicación Go
  # ============================================
  factorit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: factorit-app
    restart: unless-stopped
    ports:
      - "${SERVICE_PORT:-8080}:8080"  # Puerto de la API
    env_file:
      - .env  # Cargar variables desde archivo .env
    networks:
      - factorit-network
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: factorit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: observ-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - factorit-network  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  prometheus:
    image: prom/prometheus:latest
    container_name: factorit-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./pkg/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - factorit-network

  grafana:
    image: grafana/grafana:latest
    container_name: factorit-grafana
    ports:
      - "3000:3000"
    env_file:
      - .env  # Cargar GF_SECURITY_ADMIN_PASSWORD desde .env
    volumes:
      # Persistencia de dashboards, datasources, plugins, etc.
      - grafana-data:/var/lib/grafana
    networks:
      - factorit-network
    restart: unless-stopped
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: factorit-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/observ-db?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - factorit-network
    depends_on:
      - postgres
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: factorit-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP receiver
      - "4317:4317"    # OTLP gRPC receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true  # Enable OpenTelemetry Protocol
      - LOG_LEVEL=info
    networks:
      - factorit-network

  # ============================================
  # OTEL COLLECTOR - Central Telemetry Hub
  # ============================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: factorit-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      # OTLP receivers (para recibir telemetría de la app)
      - "4319:4317"    # OTLP gRPC receiver (puerto externo 4319 → interno 4317)
      - "4320:4318"    # OTLP HTTP receiver (puerto externo 4320 → interno 4318)
      # Prometheus metrics endpoint (Prometheus hará scraping aquí)
      - "8889:8889"    # Prometheus exporter
      # Self-monitoring endpoints
      - "8888:8888"    # Collector self-metrics
      - "13133:13133"  # Health check
      - "55679:55679"  # zpages (debug UI)
      - "1777:1777"    # pprof (profiling)
    networks:
      - factorit-network
    depends_on:
      - jaeger
      - loki
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # LOKI - Log Aggregation System
  # ============================================
  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    ports:
      - "3100:3100"  # API HTTP para recibir logs y queries
    volumes:
      # Montar configuración
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      # Volumen para persistencia de logs
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - factorit-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # PROMTAIL - Log Shipper (envía logs a Loki)
  # ============================================
  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail
    volumes:
      # Montar configuración
      - ./config/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      # Montar socket de Docker para leer logs de contenedores
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Volumen para guardar posiciones (checkpoint)
      - promtail-data:/tmp
    command: -config.file=/etc/promtail/config.yml
    networks:
      - factorit-network
    restart: unless-stopped
    depends_on:
      - loki



volumes:
  postgres_data:
    driver: local

  grafana-data:
    driver: local

  loki-data:
    driver: local

  promtail-data:
    driver: local

networks:
  factorit-network:
    driver: bridge