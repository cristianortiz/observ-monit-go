# config/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ✅ NUEVO: Scraping de métricas OTEL desde el Collector
  - job_name: 'factorit-via-otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']  # Collector expone métricas en :8889
    # El Collector recibe métricas de la app vía OTLP y las expone en formato Prometheus

  # ❌ DEPRECATED: App ya no expone /metrics directamente
  # - job_name: 'factorit'
  #   static_configs:
  #     - targets: ['host.docker.internal:8080']

  # ✅ Self-monitoring del Collector (opcional)
  - job_name: 'otel-collector-self-metrics'
    static_configs:
      - targets: ['otel-collector:8888']  # Collector self-metrics

  # ✅ PostgreSQL exporter (sin cambios)
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']